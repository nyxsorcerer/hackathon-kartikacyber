name: asset-monitor
x-app: &app
  image: asset-monitor-app:0.1.0
  build:
    context: .
    dockerfile: Dockerfile
    target: app
  restart: unless-stopped
  init: true
  networks: [application]
  volumes: [artifact-data:/data/artifacts]
  environment: &app-env
    NUMEN_DATABASE_URL: postgresql+psycopg://numen:${POSTGRES_PASSWORD:?Run setup first}@db:5432/numen
    NUMEN_SECRET_KEY: ${NUMEN_SECRET_KEY:?Run setup first}
    NUMEN_ARTIFACT_ROOT: /data/artifacts
    NUMEN_FRONTEND_ROOT: /app/frontend/dist
    NUMEN_BROKER_URL: http://runner-broker:8081
    NUMEN_BROKER_TOKEN: ${NUMEN_BROKER_TOKEN:?Run setup first}
    NUMEN_DASHBOARD_URL: ${NUMEN_DASHBOARD_URL:-http://localhost:8788}
    NUMEN_MONITOR_INTERVAL_DAYS: ${NUMEN_MONITOR_INTERVAL_DAYS:-7}
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  depends_on:
    db:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully
services:
  db:
    image: postgres:18.0-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: numen
      POSTGRES_USER: numen
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run setup first}
    volumes: [postgres-data:/var/lib/postgresql]
    networks: [application, push-db, agent-db]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U numen -d numen]
      interval: 5s
      timeout: 5s
      retries: 20
  migrate:
    <<: *app
    restart: no
    # The ingress roles are created outside the migrations; this sets their LOGIN, passwords and
    # limits on every start (ADR-0006 8).
    command: [sh, -c, "alembic upgrade head && python -m numen.cli ingress-roles"]
    environment:
      <<: *app-env
      NUMEN_PUSH_DATABASE_PASSWORD: ${NUMEN_PUSH_DATABASE_PASSWORD:?Run setup first}
      NUMEN_AGENT_DATABASE_PASSWORD: ${NUMEN_AGENT_DATABASE_PASSWORD:?Run setup first}
    depends_on:
      db:
        condition: service_healthy
  bootstrap-operator:
    <<: *app
    profiles: [setup]
    restart: no
    command: [python, -m, numen.cli, bootstrap]
    environment:
      <<: *app-env
      NUMEN_ADMIN_PASSWORD_FILE: /run/secrets/bootstrap-password
    secrets: [bootstrap-password]
  app:
    <<: *app
    ports: ["127.0.0.1:${NUMEN_PORT:-8788}:8080"]
    # Encrypts Push webhook secrets. Only ingress-push, the app and the worker hold it (ADR-0006 5).
    # NUMEN_SIGNING_KEY encrypts the Dashboard key, which signs every agent configuration and command;
    # only the app holds it (B04). The enroll command shows NUMEN_AGENT_URL and NUMEN_AGENT_TLS_PIN.
    environment:
      <<: *app-env
      NUMEN_INGRESS_KEY: ${NUMEN_INGRESS_KEY:?Run setup first}
      NUMEN_SIGNING_KEY: ${NUMEN_SIGNING_KEY:?Run setup first}
      NUMEN_AGENT_TLS_PIN: ${NUMEN_AGENT_TLS_PIN:?Run setup first}
      NUMEN_AGENT_URL: ${NUMEN_AGENT_URL:-https://127.0.0.1:8792}
    # Agent session chat relays operator input to the broker.
    networks: [application, control]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 20
  worker:
    <<: *app
    command: [python, -m, numen.worker]
    environment:
      <<: *app-env
      NUMEN_WORKER_CONCURRENCY: ${NUMEN_WORKER_CONCURRENCY:-3}
      NUMEN_AUDIT_CONCURRENCY: ${NUMEN_AUDIT_CONCURRENCY:-3}
      NUMEN_INGRESS_KEY: ${NUMEN_INGRESS_KEY:?Run setup first}
    networks: [application, control]
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      runner-broker:
        condition: service_healthy
  scheduler:
    <<: *app
    command: [python, -m, numen.scheduler]
    networks: [application, control]
  runner-broker:
    image: asset-monitor-broker:0.1.0
    build:
      context: .
      dockerfile: Dockerfile.runner
      target: broker
    restart: unless-stopped
    init: true
    networks: [control]
    environment:
      NUMEN_RUNNER_INSTANCE: ${COMPOSE_PROJECT_NAME:-asset-monitor}
      NUMEN_BROKER_TOKEN: ${NUMEN_BROKER_TOKEN:?Run setup first}
      NUMEN_RUNNER_STATE: /data/runner
      NUMEN_RUNNER_CONCURRENCY: ${NUMEN_RUNNER_CONCURRENCY:-4}
      NUMEN_AGENT_BACKEND: ${NUMEN_AGENT_BACKEND:-herdr}
      # Lab phase one fetches dependencies from this registry only (https on port 443).
      NUMEN_NPM_REGISTRY_URL: ${NUMEN_NPM_REGISTRY_URL:-https://registry.npmjs.org}
      # Demo VM only (A10): the Docker network of the demo's served-content fixture. Its subnet is the
      # one private range a Served-content check may reach. Empty by default: public addresses only.
      NUMEN_SERVED_CONTENT_FIXTURE_NETWORK: ${NUMEN_SERVED_CONTENT_FIXTURE_NETWORK:-}
    volumes: [/var/run/docker.sock:/var/run/docker.sock, runner-state:/data/runner]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8081/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20
  fetch-gateway:
    image: asset-monitor-gateway:0.1.0
    build:
      context: .
      dockerfile: Dockerfile.runner
      target: gateway
    restart: unless-stopped
    init: true
    networks: [egress]
    read_only: true
    tmpfs: ["/tmp:size=16m,uid=10001,gid=10001"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8082/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20
  # The ingress (B01, ADR-0006): one service per listener, off the x-app anchor, so neither holds the
  # vault key, the broker token or the database owner's password. Each joins its own bridge, which
  # carries its published port, and an internal network that only it and db share.
  ingress-push:
    image: asset-monitor-app:0.1.0
    restart: unless-stopped
    init: true
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    command: [python, -m, numen.ingress, push]
    networks: [push-inbound, push-db]
    # The only port a Public tunnel may reach.
    ports: ["127.0.0.1:${NUMEN_PUSH_PORT:-8791}:8083"]
    environment:
      NUMEN_DATABASE_URL: postgresql+psycopg://asset_monitor_push:${NUMEN_PUSH_DATABASE_PASSWORD:?Run setup first}@db:5432/numen
      NUMEN_INGRESS_KEY: ${NUMEN_INGRESS_KEY:?Run setup first}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # A TCP connect: an HTTP check would spend the listener's global bucket.
      test: [CMD, python, -c, "import socket; socket.create_connection(('localhost', 8083), 3).close()"]
      interval: 5s
      timeout: 5s
      retries: 20
  ingress-agent:
    image: asset-monitor-app:0.1.0
    restart: unless-stopped
    init: true
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    command: [python, -m, numen.ingress, agent]
    networks: [agent-inbound, agent-db]
    # Each server's Agent tunnel reaches this port and nothing else.
    ports: ["127.0.0.1:${NUMEN_AGENT_PORT:-8792}:8084"]
    # The TLS key and the self-signed certificate made from it at every start.
    tmpfs: ["/tmp:size=1m,uid=10001,gid=10001,mode=0700"]
    environment:
      NUMEN_DATABASE_URL: postgresql+psycopg://asset_monitor_agent:${NUMEN_AGENT_DATABASE_PASSWORD:?Run setup first}@db:5432/numen
      NUMEN_AGENT_TLS_KEY: ${NUMEN_AGENT_TLS_KEY:?Run setup first}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # The container holds the key, not the pin, so this check does not verify the certificate.
      test: [CMD, python, -c, "import ssl, urllib.request; urllib.request.urlopen('https://localhost:8084/health', timeout=3, context=ssl._create_unverified_context())"]
      interval: 5s
      timeout: 5s
      retries: 20
  pi-image:
    image: asset-monitor-pi:0.1.0
    profiles: [images]
    build: {context: ., dockerfile: Dockerfile.runner, target: pi}
    command: [pi, --version]
    network_mode: none
  claude-image:
    image: asset-monitor-claude:0.1.0
    profiles: [images]
    build: {context: ., dockerfile: Dockerfile.runner, target: claude}
    command: [claude, --version]
    network_mode: none
  codex-image:
    image: asset-monitor-codex:0.1.0
    profiles: [images]
    build: {context: ., dockerfile: Dockerfile.runner, target: codex}
    command: [codex, --version]
    network_mode: none
  probe-image:
    image: asset-monitor-probe:0.1.0
    profiles: [images]
    build: {context: ., dockerfile: Dockerfile.runner, target: probe}
    network_mode: none
  lab-image:
    image: asset-monitor-lab:0.1.0
    profiles: [images]
    build: {context: ., dockerfile: Dockerfile.runner, target: lab}
    network_mode: none
  backend-tests:
    <<: *app
    profiles: [test]
    image: asset-monitor-backend-test:0.1.0
    build: {context: ., dockerfile: Dockerfile, target: test}
    restart: no
    environment:
      <<: *app-env
      # A passing test's tmp_path is removed at teardown, so a full run does not fill the disk.
      PYTEST_ADDOPTS: -o tmp_path_retention_policy=failed
    command: [pytest, -q, -p, no:cacheprovider]
  runner-tests:
    image: asset-monitor-runner-test:0.1.0
    profiles: [test]
    build: {context: ., dockerfile: Dockerfile.runner, target: test}
    command: [pytest, -q, -p, no:cacheprovider]
    network_mode: none
  frontend-tests:
    image: asset-monitor-frontend-test:0.1.0
    profiles: [test]
    build: {context: ., dockerfile: Dockerfile, target: frontend-tests}
    command: [npm, test]
    network_mode: none
  runner-runtime-tests:
    image: asset-monitor-runner-test:0.1.0
    profiles: [test]
    build: {context: ., dockerfile: Dockerfile.runner, target: test}
    user: root
    environment:
      NUMEN_DOCKER_TESTS: "1"
      NUMEN_RUNNER_INSTANCE: runtime-tests
      # A test Lab never reaches a real registry: its fixtures vendor every dependency.
      NUMEN_NPM_REGISTRY_URL: https://registry.invalid
    volumes: [/var/run/docker.sock:/var/run/docker.sock]
    command: [pytest, -q, -p, no:cacheprovider]
    network_mode: none
networks:
  application:
  control:
    internal: true
  egress:
  push-inbound:
  agent-inbound:
  push-db:
    internal: true
  agent-db:
    internal: true
volumes:
  postgres-data:
  artifact-data:
  runner-state:
secrets:
  bootstrap-password:
    file: ./.numen/bootstrap-password
