services:
  fixtures:
    image: asset-monitor-app:0.1.0
    user: root
    environment:
      NUMEN_FIXTURE_SVN: "1"
    entrypoint: [/fixtures/start.sh]
    # /standin/drop: the enroll drops /admin/server/enroll writes for server-standin, and its results;
    # /standin/www: the stand-in server's web root, which /admin/server-files writes (B05);
    # /standin/state: the agent's state directory, read-only, whose Quarantine folder /admin/state lists (B07).
    volumes: [./tests/integration:/fixtures:ro, standin-drop:/standin/drop, standin-www:/standin/www, standin-state:/standin/state:ro]
    ports: ["127.0.0.1:18091:8090"]
    networks:
      application:
      # The Served-content fixture (A10): a check's gateway joins this network and reaches only its
      # range. cdn.clickfix-fixture.test is the fixture itself, posing as an external script host.
      served:
        aliases: [cdn.clickfix-fixture.test]
      # The GitHub push stand-in (B02) sends Push deliveries to ingress-push over this network only.
      stand-ins:
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8090/health', timeout=3)"]
      interval: 3s
      timeout: 3s
      retries: 20
  app:
    environment: &test-env
      NUMEN_TEST_MODE: "1"
      NUMEN_GITHUB_API_URL: http://fixtures:8090
      # Exposure's read-only mirror (A05): the fixture answers 404, so a clone fails fast as unknown.
      NUMEN_GITHUB_GIT_URL: http://fixtures:8090/git
      NUMEN_NVD_API_URL: http://fixtures:8090/rest/json/cves/2.0
      # The Advisory check's OSV feed (A09). The fixture's OSV, GHSA (/advisories) and NVD cpeName
      # routes list CVE-2026-111497 for node 20.11.1 only and answer every other query empty.
      NUMEN_OSV_URL: http://fixtures:8090/osv
      NUMEN_NPM_REGISTRY_URL: http://fixtures:8090/npm
      NUMEN_PACKAGIST_URL: http://fixtures:8090/packagist
      NUMEN_WORDPRESS_SVN_URL: svn://fixtures:3690
      # The agent listener as the stand-in server sees it, in the enroll command (B04).
      NUMEN_AGENT_URL: https://ingress-agent:8084
    depends_on:
      fixtures:
        condition: service_healthy
  runner-broker:
    environment:
      NUMEN_NPM_REGISTRY_URL: https://registry.invalid
      # The demo fixture's private range, opened to Served-content checks by this override only.
      NUMEN_SERVED_CONTENT_FIXTURE_NETWORK: asset-monitor-test-served
  worker:
    environment: *test-env
    depends_on:
      fixtures:
        condition: service_healthy
  # Added to their two base networks; production has no stand-ins network (ADR-0006 5).
  ingress-push:
    networks: [stand-ins]
  ingress-agent:
    networks: [stand-ins]
  # The stand-in server (B04): the real On-server agent binary, as root with only the capabilities
  # its unit allows, on the stand-ins network alone, with no port and no dashboard secret. It
  # enrolls from the drop the fixture writes, then runs the agent against its fixture web root.
  server-standin:
    image: asset-monitor-server-standin:0.1.0
    build: {context: ., dockerfile: Dockerfile, target: server-standin}
    user: root
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, DAC_READ_SEARCH, FOWNER]
    security_opt: [no-new-privileges:true]
    init: true
    entrypoint: [python, /fixtures/server_standin.py]
    networks: [stand-ins]
    volumes:
      - ./tests/integration:/fixtures:ro
      - standin-drop:/standin/drop
      - standin-www:/var/www/html
      - standin-state:/var/lib/asset-monitor-agent
    # The agent's configuration directory (enroll writes it 0600, root-owned) and its unit's.
    tmpfs: ["/etc/asset-monitor-agent:mode=0700", /tmp]
networks:
  stand-ins:
    internal: true
  served:
    name: asset-monitor-test-served
    internal: true
volumes:
  standin-drop:
  standin-www:
  standin-state:
