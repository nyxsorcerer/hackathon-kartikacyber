[project]
name = "numen-runner"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi==0.118.0", "uvicorn==0.37.0", "docker==7.1.0", "jsonschema==4.25.1", "httpx==0.28.1"]
[project.optional-dependencies]
dev = ["pytest==8.4.2"]
[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["numen_runner"]
[tool.pytest.ini_options]
testpaths = ["tests"]
